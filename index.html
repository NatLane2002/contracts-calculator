<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futures Contracts Calculator</title>
  <!-- Favicon -->
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css" />
  <!-- Add Google Fonts for improved typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Dark/Light Mode Toggle Button -->
  <button class="darkModeBtn" id="darkModeBtn" onclick="toggleDarkMode()" aria-label="Toggle Dark Mode">
    <!-- Moon icon - shown in light mode -->
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <!-- Sun icon - shown in dark mode -->
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
  
  <!-- Instrument Selection -->
  <div class="instrument-selector">
    <label class="radio-label">
      <input type="radio" name="instrument" value="sp500" aria-labelledby="sp500-radio-label" />
      <span id="sp500-radio-label">ES</span>
    </label>
    <label class="radio-label">
      <input type="radio" name="instrument" value="nasdaq" checked aria-labelledby="nasdaq-radio-label" />
      <span id="nasdaq-radio-label">NQ</span>
    </label>
    <label class="radio-label">
      <input type="radio" name="instrument" value="dowJones" aria-labelledby="dowJones-radio-label" />
      <span id="dowJones-radio-label">YM</span>
    </label>
  </div>
  
  <div class="container">
    <!-- Table View Button (positioned at top left) -->
    <button id="tableViewBtn" class="table-view-btn" onclick="navigateToTableView()" aria-label="View Stop Loss Range Table">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="9" x2="9" y1="3" y2="21"/><line x1="15" x2="15" y1="3" y2="21"/></svg>
    </button>
    
    <!-- Toggle Switch for Mini/Micro Mode -->
    <div class="container-toggle">
      <span class="toggle-label">Micro</span>
      <label class="toggle-switch">
        <input type="checkbox" id="contractToggle" onchange="toggleContracts()" aria-label="Toggle between Micro and Mini contracts">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">Mini</span>
    </div>
    
    <h1>Futures Contracts Calculator</h1>
    
    <!-- Input Section -->
    <div class="form-section">
      <div class="input-container">
        <div class="input-wrapper">
          <label for="riskAmount">Risk Amount</label>
          <input type="number" id="riskAmount" placeholder="Enter Amount" step="0.01" />
        </div>
        <div class="input-wrapper">
          <label for="points">Points</label>
          <input type="number" id="points" placeholder="Enter Points" step="0.25" />
        </div>
      </div>
    </div>
    
    <!-- Results Section -->
    <div class="results-section">
      <div class="result-box" id="sp500-box">
        <h2 id="sp500-label">MES</h2>
        <p id="sp500">0.0</p>
      </div>
      <div class="result-box" id="nasdaq-box">
        <h2 id="nasdaq-label">MNQ</h2>
        <p id="nasdaq">0.0</p>
      </div>
      <div class="result-box" id="dowJones-box">
        <h2 id="dowJones-label">MYM</h2>
        <p id="dowJones">0.0</p>
      </div>
    </div>
    
    <p class="disclaimer">
      Disclaimer: I am not responsible if you blow your account while using this calculator
    </p>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
